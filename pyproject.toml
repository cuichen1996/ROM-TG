[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-tg"
version = "0.1.0"
description = "Learning coarse spaces from smoothed-error manifolds for two-grid solvers"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Chen Cui"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "torch>=2.4",
  "matplotlib>=3.8",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
learned-tg = "learned_tg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
